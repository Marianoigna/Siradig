[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "DJ"]
ignore = ["E501"]  # Black se encarga de longitud de linea

[tool.ruff.lint.isort]
known-first-party = ["core", "receipts", "siradig_auto"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.coverage.run]
source = ["core", "receipts"]
omit = ["venv/*", "*/migrations/*", "*/__pycache__/*", "*/tests.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if settings.DEBUG:",
    "if __name__ == \"__main__\":",
]

[tool.pytest.ini_options]
django_find_project = true
python_files = ["tests.py", "test_*.py"]
testpaths = ["receipts"]
addopts = "--ds core.settings -v --cov --cov-report=term-missing"